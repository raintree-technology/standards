version: 1
integration: cloudflare
evaluations:
  - { id: CLOUDFLARE-EVAL-CROSS-REQUEST, workflow: CLOUDFLARE-WF-RUNTIME, capabilities: [CLOUDFLARE-CAP-REQUEST], scenario: Two users hit the same warm isolate while code stores request state globally, sources: [CLOUDFLARE-SRC-BEST], evidence: [concurrent test, response and log correlation], expected: No request-specific state crosses users and the design keeps only safe immutable global state, prohibited: Treating single-request local tests as isolation evidence }
  - { id: CLOUDFLARE-EVAL-CACHE-AUTH, workflow: CLOUDFLARE-WF-RUNTIME, capabilities: [CLOUDFLARE-CAP-CACHE], scenario: Two authenticated users request the same path with different data, sources: [CLOUDFLARE-SRC-CACHE], evidence: [cache keys headers bodies and hit state], expected: Private representations are not shared across users, prohibited: A path-only key for personalized content }
  - { id: CLOUDFLARE-EVAL-DROPPED-PROMISE, workflow: CLOUDFLARE-WF-RUNTIME, capabilities: [CLOUDFLARE-CAP-BACKGROUND], scenario: The response returns while an untracked write is pending and the isolate ends, sources: [CLOUDFLARE-SRC-BEST], evidence: [runtime result, durable work record, retry outcome], expected: Work is awaited or routed through waitUntil a queue or workflow with replay protection, prohibited: Bare asynchronous work whose completion is assumed }
  - { id: CLOUDFLARE-EVAL-BINDING-MIXUP, workflow: CLOUDFLARE-WF-RUNTIME, capabilities: [CLOUDFLARE-CAP-BINDING], scenario: Preview configuration points a binding at a production resource, sources: [CLOUDFLARE-SRC-BINDINGS], evidence: [generated types, effective environment config, denied mutation], expected: Environment-resource mapping prevents production access, prohibited: Identical binding names as proof of correct resource scope }
  - { id: CLOUDFLARE-EVAL-COMPATIBILITY, workflow: CLOUDFLARE-WF-DEPLOY, capabilities: [CLOUDFLARE-CAP-DEPLOY, CLOUDFLARE-CAP-OBSERVE], scenario: A compatibility-date update changes runtime behavior on an error path, sources: [CLOUDFLARE-SRC-WORKERS, CLOUDFLARE-SRC-BEST], evidence: [before and after tests, deployed configuration, runtime signals], expected: The behavior change is detected before full release and the prior version remains recoverable, prohibited: Updating compatibility without focused regression tests }
  - { id: CLOUDFLARE-EVAL-WAF-CALLBACK, workflow: CLOUDFLARE-WF-FIREWALL, capabilities: [CLOUDFLARE-CAP-FIREWALL], scenario: A new rule blocks a legitimate payment or email callback, sources: [CLOUDFLARE-SRC-WAF], evidence: [rule match, callback test, authoritative downstream state, rollback], expected: Publication stops or is rolled back before callback loss creates unreconciled state, prohibited: Testing browser traffic while omitting machine callbacks }
  - { id: CLOUDFLARE-EVAL-STATEFUL-REPLAY, workflow: CLOUDFLARE-WF-STATEFUL-AUDIT, capabilities: [CLOUDFLARE-CAP-CONFIG, CLOUDFLARE-CAP-DURABLE-OBJECT, CLOUDFLARE-CAP-QUEUE, CLOUDFLARE-CAP-HYPERDRIVE], scenario: Deployed binding drift routes duplicate queue work to a hot Durable Object whose alarm retries after an ambiguous database write, sources: [CLOUDFLARE-SRC-WRANGLER, CLOUDFLARE-SRC-DO, CLOUDFLARE-SRC-QUEUES, CLOUDFLARE-SRC-HYPERDRIVE], evidence: [effective config and generated types, object and alarm state, queue attempts, database operation identity and final rows], expected: Drift is detected load is bounded and every replay converges on one intended database effect, prohibited: Trusting local config in-memory state queue delivery count or timeout as final truth }
