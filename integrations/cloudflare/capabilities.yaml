  - id: CLOUDFLARE-CAP-HYPERDRIVE
    name: Audit Hyperdrive database connectivity
    interface: workers_runtime
    availability: current
    access: { oauth_scopes: [], property_roles: [worker_service, platform_operator] }
    effect: diagnose
    approval: none
    inputs: [binding connection origin credential transaction and regional workload contract]
    outputs: [connection and transaction findings, rotation evidence, load and failure results]
    data_semantics: [CLOUDFLARE-SEM-BINDING, CLOUDFLARE-SEM-RUNTIME]
    limits: { quotas: [Bound database connections queries retries and Worker concurrency], latency: [Pool region origin and cold paths affect latency], sampling: [Exercise burst transaction timeout reconnect rotation and origin outage], privacy_suppression: [Keep origin credentials and query values out of evidence], aggregation: [Correlate request binding pool origin transaction and query outcome], completeness: [A successful query does not prove transaction or burst safety], operational: [Use the binding and current driver contract rather than direct public connection strings] }
    limitations: [Database semantics and recovery remain governed by the database provider too]
    verification: [Load test bounded concurrency and exercise credential rotation and ambiguous write timeout]
    idempotency: Retried writes use application operation identity and database constraints.
    rollback: Restore the prior binding and credential then reconcile ambiguous writes.
