version: 1
integration: cloudflare
workflows:
  - { id: CLOUDFLARE-WF-RUNTIME, name: Review Worker runtime behavior, trigger: Request handling bindings caching or background behavior changes, sources: [CLOUDFLARE-SRC-WORKERS, CLOUDFLARE-SRC-BEST, CLOUDFLARE-SRC-BINDINGS, CLOUDFLARE-SRC-CACHE], capabilities: [CLOUDFLARE-CAP-REQUEST, CLOUDFLARE-CAP-BINDING, CLOUDFLARE-CAP-CACHE, CLOUDFLARE-CAP-BACKGROUND], steps: [Retrieve current types docs and configuration schema, generate binding types, inspect streaming promises global state crypto cache and errors, exercise replay isolation large-body timeout and outage paths], stop_conditions: [Types or effective bindings are unknown, request data can cross isolates or cache partitions, floating work can be dropped], outputs: [Type and config evidence, runtime tests, failure and recovery record] }
  - { id: CLOUDFLARE-WF-DEPLOY, name: Release a Worker deployment, trigger: Worker code compatibility routes or environment configuration changes, sources: [CLOUDFLARE-SRC-WORKERS, CLOUDFLARE-SRC-BEST, CLOUDFLARE-SRC-OBS], capabilities: [CLOUDFLARE-CAP-DEPLOY, CLOUDFLARE-CAP-OBSERVE], steps: [Pin tooling and review compatibility change, verify exact routes bindings and environment, deploy the tested version gradually where supported, inspect logs traces journeys and rollback], stop_conditions: [Compatibility behavior is implicit, routes or environment are ambiguous, rollback cannot address stateful effects], outputs: [Version and configuration identity, observation evidence, rollback decision] }
  - { id: CLOUDFLARE-WF-FIREWALL, name: Prepare an edge-security change for human publication, trigger: WAF rate-limit bot or access policy changes, sources: [CLOUDFLARE-SRC-WAF, CLOUDFLARE-SRC-OBS], capabilities: [CLOUDFLARE-CAP-FIREWALL, CLOUDFLARE-CAP-OBSERVE], steps: [Inventory routes crawlers webhooks and trusted automation, inspect exact rule order and scope, gather non-blocking or simulated traffic evidence, test representative allowed and denied paths, present publication and rollback to the human owner], stop_conditions: [Legitimate traffic cannot be distinguished, bypass scope is broad, production authority is absent], outputs: [Exact rule diff, traffic evidence, human decision and rollback record] }
  - { id: CLOUDFLARE-WF-STATEFUL-AUDIT, name: Audit configuration stateful work queues and database connectivity, trigger: Wrangler Durable Object Queue or Hyperdrive behavior changes, sources: [CLOUDFLARE-SRC-WRANGLER, CLOUDFLARE-SRC-DO, CLOUDFLARE-SRC-QUEUES, CLOUDFLARE-SRC-HYPERDRIVE, CLOUDFLARE-SRC-BINDINGS], capabilities: [CLOUDFLARE-CAP-CONFIG, CLOUDFLARE-CAP-DURABLE-OBJECT, CLOUDFLARE-CAP-QUEUE, CLOUDFLARE-CAP-HYPERDRIVE], steps: [Validate config schema generate types and compare deployed bindings, test object sharding persistence migrations concurrency and alarm replay, interrupt partial queue batches and recover poison messages, burst and rotate Hyperdrive connections while reconciling ambiguous writes], stop_conditions: [Effective config differs without explanation, critical object state exists only in memory, consumer effects are not repeat-safe, database concurrency or credential rotation is unbounded], outputs: [Configuration diff, state and alarm tests, queue recovery evidence, database load rotation and reconciliation results] }
