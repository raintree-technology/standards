version: 1
integration: neon
workflows:
  - { id: NEON-WF-RUNTIME, name: Qualify runtime connectivity, trigger: Driver endpoint pooling autoscaling or network access changes, sources: [NEON-SRC-CONNECT, NEON-SRC-POOL, NEON-SRC-AUTOSCALE, NEON-SRC-IP], capabilities: [NEON-CAP-CONNECT, NEON-CAP-NETWORK], steps: [Map runtime transaction and concurrency needs, choose endpoint and role, apply least network authority, exercise burst cold-start timeout reconnect allowed and denied paths], stop_conditions: [Connection concurrency is unbounded, preview can reach production, rollback access is untested], outputs: [Connection rationale, load evidence, effective network policy] }
  - { id: NEON-WF-MIGRATE, name: Test and release a database migration, trigger: Schema constraint index or data transformation changes, sources: [NEON-SRC-BRANCH, NEON-SRC-CONNECT], capabilities: [NEON-CAP-BRANCH, NEON-CAP-MIGRATION], steps: [Create an isolated governed branch, measure representative data and queries, run forward rollback retry and compatibility checks, approve and execute the exact production migration, inspect final state], stop_conditions: [Representative volume is missing, locks or data loss exceed bounds, old and new applications cannot coexist when rollout requires it], outputs: [Branch lineage, migration timing, compatibility and rollback evidence] }
  - { id: NEON-WF-RECOVER, name: Execute a database recovery exercise, trigger: Scheduled exercise corruption accidental change or incident, sources: [NEON-SRC-RESTORE, NEON-SRC-BRANCH], capabilities: [NEON-CAP-RESTORE], steps: [Fix the exact recovery objective and timestamp, preserve incident evidence, restore into isolation first, verify integrity and external-system divergence, present the production recovery decision to the human owner], stop_conditions: [Restore window or lost-write boundary is unknown, external reconciliation is missing, production authority is absent], outputs: [Measured recovery point and time, restored-state checks, human decision and reconciliation plan] }
  - { id: NEON-WF-DATA-PATH-AUDIT, name: Audit transfer replica and replication paths, trigger: Query shape read routing CDC or database transfer cost changes, sources: [NEON-SRC-EGRESS, NEON-SRC-REPLICAS, NEON-SRC-REPLICATION], capabilities: [NEON-CAP-EGRESS, NEON-CAP-READ-REPLICA, NEON-CAP-LOGICAL-REPLICATION], steps: [Rank queries by rows frequency and width, verify selected columns pagination aggregation and response compatibility, test timestamped primary and replica reads, interrupt CDC and compare checkpoint source and destination], stop_conditions: [Result size is unbounded, consistency-sensitive reads route to an unqualified replica, replication lag or retained WAL has no bound], outputs: [Transfer measurements, routing matrix and freshness tests, CDC lag recovery and deletion evidence] }
