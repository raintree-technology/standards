version: 1
integration: neon
evaluations:
  - { id: NEON-EVAL-CONNECTION-STORM, workflow: NEON-WF-RUNTIME, capabilities: [NEON-CAP-CONNECT], scenario: A serverless burst resumes a suspended compute and retries timed-out writes, sources: [NEON-SRC-POOL, NEON-SRC-AUTOSCALE], evidence: [connection counts, latency distribution, transaction and row results], expected: Connections remain bounded and non-idempotent writes are not replayed, prohibited: Treating successful health checks as capacity evidence }
  - { id: NEON-EVAL-PREVIEW-BOUNDARY, workflow: NEON-WF-RUNTIME, capabilities: [NEON-CAP-NETWORK, NEON-CAP-BRANCH], scenario: A preview deployment attempts production database access, sources: [NEON-SRC-IP, NEON-SRC-BRANCH], evidence: [branch binding, network denial, role inventory], expected: Preview is confined to its governed branch and role, prohibited: Shared production credentials or network access }
  - { id: NEON-EVAL-MIGRATION-RETRY, workflow: NEON-WF-MIGRATE, capabilities: [NEON-CAP-MIGRATION], scenario: A backfill stops halfway and restarts while both application versions run, sources: [NEON-SRC-BRANCH, NEON-SRC-CONNECT], evidence: [progress markers, duplicate and missing row checks, both-version tests], expected: The migration converges without data loss or duplicate effects, prohibited: Restarting from zero without detecting prior progress }
  - { id: NEON-EVAL-RESTORE-DIVERGENCE, workflow: NEON-WF-RECOVER, capabilities: [NEON-CAP-RESTORE], scenario: Restoring before a payment callback removes the local record but not the external payment, sources: [NEON-SRC-RESTORE], evidence: [database timestamp, external event and object, reconciliation result], expected: Recovery identifies and repairs the cross-system divergence, prohibited: Declaring recovery complete from database checks alone }
  - { id: NEON-EVAL-DATA-PATH-FAILURE, workflow: NEON-WF-DATA-PATH-AUDIT, capabilities: [NEON-CAP-EGRESS, NEON-CAP-READ-REPLICA, NEON-CAP-LOGICAL-REPLICATION], scenario: A wide unpaginated query shifts to a replica while a CDC consumer is offline and falls behind, sources: [NEON-SRC-EGRESS, NEON-SRC-REPLICAS, NEON-SRC-REPLICATION], evidence: [query and byte measurements, timestamped read results, slot lag checkpoint and destination state], expected: Transfer is bounded consistency-sensitive reads stay correct and CDC catches up without duplicate destination effects, prohibited: Optimizing cost by hiding response changes accepting stale critical reads or leaving unbounded retained WAL }
