version: 1
integration: resend
workflows:
  - { id: RESEND-WF-DOMAIN, name: Establish a sending domain, trigger: A domain sender or DNS provider changes, sources: [RESEND-SRC-DOMAINS], capabilities: [RESEND-CAP-DOMAIN], steps: [Confirm ownership and message purpose, apply exact DNS records, verify provider state, test alignment and rollback ownership], stop_conditions: [DNS authority or sender purpose is unclear, records would weaken another mail system], outputs: [Domain and DNS evidence, sender inventory, rollback record] }
  - { id: RESEND-WF-TRANSACTIONAL, name: Release a transactional message, trigger: Trigger template recipient logic or delivery handling changes, sources: [RESEND-SRC-SEND, RESEND-SRC-IDEMPOTENCY, RESEND-SRC-WEBHOOKS, RESEND-SRC-VERIFY], capabilities: [RESEND-CAP-SEND, RESEND-CAP-WEBHOOK, RESEND-CAP-SUPPRESSION], steps: [Classify the message and bind a stable operation key, render accessibility and content states, send from the server, authenticate replay and reconcile delivery events, apply suppression], stop_conditions: [The message purpose is promotional, duplicate sends are possible, sender authentication or event verification is missing], outputs: [Classified message contract, render and send evidence, repeat-safe delivery state] }
  - { id: RESEND-WF-BROADCAST, name: Prepare a broadcast for human send approval, trigger: A marketing audience content or schedule changes, sources: [RESEND-SRC-SEND, RESEND-SRC-IDEMPOTENCY, RESEND-SRC-WEBHOOKS], capabilities: [RESEND-CAP-BROADCAST, RESEND-CAP-SUPPRESSION], steps: [Freeze the approved audience and suppression set, inspect exact content sender and schedule, test representative rendering, present the final operation for human execution, monitor negative signals], stop_conditions: [Consent or audience provenance is missing, unsubscribe or suppression is stale, exact final content is not approved], outputs: [Audience snapshot, final render, human decision, monitored result] }
