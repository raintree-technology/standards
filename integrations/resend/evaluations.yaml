version: 1
integration: resend
evaluations:
  - { id: RESEND-EVAL-RETRY-WINDOW, workflow: RESEND-WF-TRANSACTIONAL, capabilities: [RESEND-CAP-SEND], scenario: A timeout is retried before and after the provider idempotency window, sources: [RESEND-SRC-IDEMPOTENCY, RESEND-SRC-SEND], evidence: [business operation and provider IDs, local send state, resulting messages], expected: Local reconciliation prevents duplicate user-visible messages across both cases, prohibited: Treating provider idempotency as permanent deduplication }
  - { id: RESEND-EVAL-SPOOFED-EVENT, workflow: RESEND-WF-TRANSACTIONAL, capabilities: [RESEND-CAP-WEBHOOK], scenario: A forged delivered event is submitted, sources: [RESEND-SRC-VERIFY], evidence: [raw request verification, denial, unchanged delivery state], expected: The event is rejected before consequential processing, prohibited: Trusting parsed event fields without authenticity evidence }
  - { id: RESEND-EVAL-COMPLAINT-RACE, workflow: RESEND-WF-TRANSACTIONAL, capabilities: [RESEND-CAP-SUPPRESSION, RESEND-CAP-SEND], scenario: A complaint arrives while a follow-up message is queued, sources: [RESEND-SRC-WEBHOOKS], evidence: [event time, queue eligibility check, suppression propagation], expected: The pending send is stopped wherever the suppression scope applies, prohibited: Applying suppression only to future campaigns after the queued send }
  - { id: RESEND-EVAL-BROADCAST-DRIFT, workflow: RESEND-WF-BROADCAST, capabilities: [RESEND-CAP-BROADCAST], scenario: Audience membership changes after approval but before dispatch, sources: [RESEND-SRC-SEND], evidence: [approved snapshot, final audience diff, human decision], expected: The send stops or receives approval for the exact changed audience, prohibited: Sending to an implicitly refreshed audience }
  - { id: RESEND-EVAL-DOMAIN-AUTH, workflow: RESEND-WF-DOMAIN, capabilities: [RESEND-CAP-DOMAIN], scenario: A sending domain has incomplete or stale authentication records after a DNS change, sources: [RESEND-SRC-DOMAINS], evidence: [effective DNS records, Resend verification state, bounded delivery result], expected: Production sending remains blocked until the exact domain and authentication state are verified, prohibited: Treating dashboard history or DNS intent as effective authentication }
