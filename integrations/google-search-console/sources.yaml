  - surface: legacy-reports-and-tools
    classification: legacy
    capabilities: [GSC-CAP-LEGACY-SURFACES]
    sources: [GSC-SRC-REPORTS]
    rationale: Current official inventory retains Data Highlighter and Web Tools as legacy while other retired reports require replacement guidance.
  - surface: full-google-search-central-corpus
    classification: excluded
    capabilities: []
    sources: [GSC-SRC-SEARCH-DOCS]
    rationale: General crawling, indexing, appearance, ecommerce, and content policy belong to SEO standards, not this product capability bundle.
