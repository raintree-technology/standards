change_watch:
  - id: GSC-WATCH-FAQ-APPEARANCE-DEPRECATION
    status: announced_deprecation
    effective: "2026-08"
    affected_capabilities: [GSC-CAP-SEARCH-ANALYTICS-QUERY, GSC-CAP-RICH-RESULTS]
    action: Stop depending on FAQ search-appearance output, confirm the field's current API behavior before querying it, and retain historical meaning in stored data.
    sources: [GSC-SRC-SEARCH-ANALYTICS-METHOD]
  - id: GSC-WATCH-GENERATIVE-AI-ROLLOUT
    status: limited_rollout
    effective: rolling
    affected_capabilities: [GSC-CAP-GENERATIVE-AI-CONTROL-REVIEW, GSC-CAP-GENERATIVE-AI-CONTROL-MANAGE, GSC-CAP-GENERATIVE-AI-PERFORMANCE-SEARCH, GSC-CAP-GENERATIVE-AI-PERFORMANCE-DISCOVER]
    action: Re-read the control and both report sources before use; record UI availability, included features, inherited state, and eligibility instead of treating absence as an error.
    sources: [GSC-SRC-GENERATIVE-AI-CONTROL, GSC-SRC-GENERATIVE-AI-SEARCH, GSC-SRC-GENERATIVE-AI-DISCOVER]
  - id: GSC-WATCH-PLATFORM-PROPERTY-ROLLOUT
    status: limited_rollout
    effective: rolling
    affected_capabilities: [GSC-CAP-PLATFORM-PROPERTY-REVIEW, GSC-CAP-PLATFORM-PROPERTY-CONNECT]
    action: Confirm the currently supported platforms, connection route, verification behavior, reports, and account eligibility before onboarding.
    sources: [GSC-SRC-PLATFORM-PROPERTIES]

