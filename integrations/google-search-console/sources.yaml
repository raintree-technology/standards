version: 1
integration: google-search-console
reviewed_on: 2026-08-13
scope: >-
  Current official Google Search Console reports, settings, APIs, BigQuery export,
  notifications, and directly adjacent Google tools required to interpret or act on
  Search Console evidence. General Search Central guidance is included only when it
  defines an operational boundary used by this bundle.
freshness:
  cadence_days: 31
  next_review: 2026-09-13
  event_triggers:
    - Google changes the Reports at a glance, property settings, shopping, or platform-property inventories.
    - An API discovery document, OAuth scope, permission matrix, quota, field, enum, or deprecation changes.
    - A limited-rollout surface becomes general, changes eligibility, or disappears.
    - BigQuery tables, retry behavior, export completeness, cost behavior, or Indexing API eligibility changes.

