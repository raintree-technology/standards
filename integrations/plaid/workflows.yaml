version: 1
integration: plaid
workflows:
  - { id: PLAID-WF-ONBOARD, name: Onboard a Plaid Item, trigger: Link products or user connection behavior changes, sources: [PLAID-SRC-LINK, PLAID-SRC-TOKENS, PLAID-SRC-SECURITY], capabilities: [PLAID-CAP-LINK, PLAID-CAP-TOKEN-EXCHANGE], steps: [Bind the user consent and exact products, complete Link without exposing durable credentials, exchange once on the server, verify Item and secret state], stop_conditions: [Product scope is speculative, an access token can reach the client, user binding is ambiguous], outputs: [Consent and product record, token-boundary evidence, verified Item] }
  - { id: PLAID-WF-SYNC, name: Synchronize Plaid data, trigger: Initial read scheduled refresh or webhook-driven update, sources: [PLAID-SRC-TOKENS, PLAID-SRC-WEBHOOKS, PLAID-SRC-SECURITY], capabilities: [PLAID-CAP-DATA-READ, PLAID-CAP-WEBHOOK], steps: [Verify event or bounded trigger, inspect Item and product state, fetch with pagination and freshness metadata, reconcile without duplicating derived records], stop_conditions: [Consent or Item state is invalid, completeness cannot be distinguished from delay, downstream use exceeds approved scope], outputs: [Request and freshness record, reconciled product data, exception state] }
  - { id: PLAID-WF-REVOKE, name: Revoke a Plaid connection, trigger: User request consent withdrawal compromise or account closure, sources: [PLAID-SRC-TOKENS, PLAID-SRC-WEBHOOKS, PLAID-SRC-SECURITY], capabilities: [PLAID-CAP-ITEM-REMOVE], steps: [Confirm exact user Item and disposition obligations, remove provider access, delete credentials, propagate retention deletion and recipient actions, verify denial], stop_conditions: [Identity or Item binding is uncertain, legal hold or retention decision is unresolved], outputs: [Approval and removal result, copy inventory, completed and deferred disposition evidence] }
  - { id: PLAID-WF-TRANSACTIONS-SYNC, name: Verify Transactions cursor convergence, trigger: Transactions Sync pagination restart or projection behavior changes, sources: [PLAID-SRC-TRANSACTIONS-SYNC, PLAID-SRC-WEBHOOKS], capabilities: [PLAID-CAP-TRANSACTIONS-SYNC, PLAID-CAP-WEBHOOK], steps: [Start from the committed Item cursor, apply each page and cursor atomically, continue until complete, inject mutation during pagination and follow the documented restart path, compare local and provider state], stop_conditions: [Cursor and page changes commit separately, a webhook is treated as transaction data, partial projection is published], outputs: [Cursor history, atomic commit evidence, converged projection and restart result] }
