version: 1
integration: vercel
evaluations:
  - { id: VERCEL-EVAL-ARTIFACT-IDENTITY, workflow: VERCEL-WF-PROMOTE, capabilities: [VERCEL-CAP-DEPLOY, VERCEL-CAP-PROMOTE], scenario: Production approval references a tested preview while CI attempts a fresh production rebuild, sources: [VERCEL-SRC-DEPLOY], evidence: [source and deployment IDs, build provenance, promotion command], expected: The exact tested artifact is promoted or the differing artifact is retested, prohibited: Treating equal source commits as proof of equal built artifacts }
  - { id: VERCEL-EVAL-PREVIEW-ISOLATION, workflow: VERCEL-WF-CONFIGURE, capabilities: [VERCEL-CAP-ENV], scenario: A preview branch requests the production database variable, sources: [VERCEL-SRC-ENV], evidence: [environment and branch scopes, denied runtime access], expected: Preview remains isolated from production mutation authority, prohibited: Copying the production value for convenience }
  - { id: VERCEL-EVAL-DRAIN-AUTH, workflow: VERCEL-WF-CONFIGURE, capabilities: [VERCEL-CAP-DRAIN], scenario: A spoofed or malformed drain payload reaches the receiver, sources: [VERCEL-SRC-OBS], evidence: [raw-body authenticity result, denied request, alert], expected: The receiver rejects unauthenticated input without processing it, prohibited: Verification after parsing and reserialization when the provider contract requires raw bytes }
  - { id: VERCEL-EVAL-FIREWALL-COLLISION, workflow: VERCEL-WF-FIREWALL, capabilities: [VERCEL-CAP-FIREWALL], scenario: A proposed user-agent or fingerprint rule also matches legitimate clients, sources: [VERCEL-SRC-FW], evidence: [log-only traffic sample, preview enforcement, exact diff], expected: Production publication stops or the rule is narrowed, prohibited: Publishing directly from an apparent attacker fingerprint }
  - { id: VERCEL-EVAL-ROLLBACK-STATE, workflow: VERCEL-WF-PROMOTE, capabilities: [VERCEL-CAP-PROMOTE, VERCEL-CAP-OBSERVE], scenario: Application rollback follows a backward-incompatible migration, sources: [VERCEL-SRC-DEPLOY, VERCEL-SRC-OBS], evidence: [compatibility assessment, failed rollback exercise, compensation plan], expected: Promotion stops until application and data recovery are jointly safe, prohibited: Representing alias rollback as full-system recovery }
  - { id: VERCEL-EVAL-RUNTIME-BOUNDARIES, workflow: VERCEL-WF-RUNTIME-AUDIT, capabilities: [VERCEL-CAP-FUNCTION, VERCEL-CAP-ROUTING, VERCEL-CAP-CACHE, VERCEL-CAP-CRON, VERCEL-CAP-STORAGE], scenario: An old client bypasses middleware while a cache expires and duplicate scheduled runs write to storage after one function is terminated, sources: [VERCEL-SRC-FUNCTIONS, VERCEL-SRC-ROUTING, VERCEL-SRC-SKEW, VERCEL-SRC-CACHE, VERCEL-SRC-CRON, VERCEL-SRC-STORAGE], evidence: [handler authorization, deployment routing, cache and origin load, operation keys, storage state], expected: Authorization holds at the handler origin load stays bounded and repeated work converges on governed storage state, prohibited: Middleware-only authorization untracked background effects or invocation-as-completion evidence }
