version: 1
integration: vercel
workflows:
  - { id: VERCEL-WF-DEPLOY, name: Build and verify a deployment, trigger: Application or build configuration changes, sources: [VERCEL-SRC-DEPLOY, VERCEL-SRC-ENV, VERCEL-SRC-OBS], capabilities: [VERCEL-CAP-DEPLOY, VERCEL-CAP-OBSERVE], steps: [Pull intended environment metadata, build with pinned tooling, test the resulting artifact, deploy without rebuilding, inspect runtime signals], stop_conditions: [The source artifact or target project is ambiguous, secret values enter logs, required tests fail], outputs: [Deployment identity, test record, bounded telemetry] }
  - { id: VERCEL-WF-PROMOTE, name: Promote and observe production, trigger: A tested deployment is approved for production, sources: [VERCEL-SRC-DEPLOY, VERCEL-SRC-OBS], capabilities: [VERCEL-CAP-PROMOTE, VERCEL-CAP-OBSERVE], steps: [Confirm exact deployment and stateful effects, obtain exact approval, promote without rebuild, verify domains journeys errors and rollback readiness], stop_conditions: [The tested deployment differs from the promoted artifact, migration compatibility is unknown, rollback target is missing], outputs: [Promotion record, production checks, rollback decision] }
  - { id: VERCEL-WF-CONFIGURE, name: Change environment or drain configuration, trigger: Environment variables or telemetry export changes, sources: [VERCEL-SRC-ENV, VERCEL-SRC-OBS, VERCEL-SRC-DEPLOY], capabilities: [VERCEL-CAP-ENV, VERCEL-CAP-DRAIN, VERCEL-CAP-DEPLOY], steps: [Map consumers environments and data fields, approve exact scopes, apply without recording values, redeploy affected artifacts, test runtime or drain behavior], stop_conditions: [Preview gains production authority, recipient governance is missing, effective runtime value cannot be verified safely], outputs: [Configuration metadata, deployment binding, delivery or runtime evidence] }
  - { id: VERCEL-WF-FIREWALL, name: Stage a firewall change for human publication, trigger: Traffic policy or abuse controls change, sources: [VERCEL-SRC-FW], capabilities: [VERCEL-CAP-FIREWALL], steps: [Inventory routes methods and trusted automation, stage log-only rules, review traffic, enforce in preview, present exact production diff and rollback], stop_conditions: [Legitimate cohorts cannot be distinguished, bypass is broad, production publication lacks human authority], outputs: [Rule diff, traffic sample, preview result, human publication decision] }
  - { id: VERCEL-WF-RUNTIME-AUDIT, name: Audit runtime routing cache schedule and storage behavior, trigger: Function middleware cache cron or storage configuration changes, sources: [VERCEL-SRC-FUNCTIONS, VERCEL-SRC-ROUTING, VERCEL-SRC-SKEW, VERCEL-SRC-CACHE, VERCEL-SRC-CRON, VERCEL-SRC-STORAGE], capabilities: [VERCEL-CAP-FUNCTION, VERCEL-CAP-ROUTING, VERCEL-CAP-CACHE, VERCEL-CAP-CRON, VERCEL-CAP-STORAGE], steps: [Map each route to runtime routing cache schedule and storage contracts, test termination direct authorization and old clients, inject cache-cold overlap duplicate and stale conditions, verify storage consistency retention export and deletion], stop_conditions: [Durable effects depend on request lifetime, handler authorization is absent, origin cannot survive a cold cache, scheduled runs can overlap unsafely, storage lifecycle is unknown], outputs: [Runtime matrix, boundary and skew tests, cache and cron results, storage lifecycle evidence] }
