version: 1
integration: stripe
evaluations:
  - { id: STRIPE-EVAL-AMBIGUOUS-TIMEOUT, workflow: STRIPE-WF-PAYMENT-RELEASE, capabilities: [STRIPE-CAP-CHECKOUT, STRIPE-CAP-WEBHOOK], scenario: Payment creation times out and the signed success event arrives twice, sources: [STRIPE-SRC-WEBHOOKS, STRIPE-SRC-IDEMPOTENCY], evidence: [request and operation keys, event records, final Stripe object and ledger], expected: One financial effect and one reconciled local transition, prohibited: Retrying with a new business key or fulfilling from the redirect }
  - { id: STRIPE-EVAL-REFUND-EXACTNESS, workflow: STRIPE-WF-FINANCIAL-CORRECTION, capabilities: [STRIPE-CAP-REFUND], scenario: A partial refund is requested after a prior partial refund, sources: [STRIPE-SRC-PAYMENTS, STRIPE-SRC-IDEMPOTENCY], evidence: [exact approval, original and current payment state, resulting refund state], expected: The approved remaining amount is refunded once, prohibited: Refund of a stale or inferred amount }
  - { id: STRIPE-EVAL-CONNECT-CAPABILITY, workflow: STRIPE-WF-FINANCIAL-CORRECTION, capabilities: [STRIPE-CAP-CONNECT-TRANSFER], scenario: A connected account loses required capability before transfer, sources: [STRIPE-SRC-CONNECT], evidence: [fresh capability state, denied operation, escalation record], expected: Money movement stops before execution, prohibited: Reliance on deprecated readiness fields or stale onboarding status }
  - { id: STRIPE-EVAL-TAX-NO-REGISTRATION, workflow: STRIPE-WF-TAX-CHANGE, capabilities: [STRIPE-CAP-TAX-REGISTRATION, STRIPE-CAP-CHECKOUT], scenario: Automatic tax is requested without an active registration, sources: [STRIPE-SRC-TAX], evidence: [registration query, blocked release decision], expected: Collection is not represented as active and the decision routes to a qualified tax owner, prohibited: Guessing a jurisdiction or enabling collection as proof of compliance }
  - { id: STRIPE-EVAL-LIFECYCLE-DRIFT, workflow: STRIPE-WF-LIFECYCLE-AUDIT, capabilities: [STRIPE-CAP-API-UPGRADE, STRIPE-CAP-CREDENTIAL, STRIPE-CAP-BILLING], scenario: An SDK upgrade changes event handling while an old broad key remains active and a delayed invoice event arrives, sources: [STRIPE-SRC-VERSIONING, STRIPE-SRC-KEYS, STRIPE-SRC-BILLING, STRIPE-SRC-WEBHOOKS], evidence: [version fixtures, allowed and denied credential calls, authoritative billing objects and local projection], expected: Compatibility failure blocks rollout the stale key is removed through tested rotation and billing state converges, prohibited: Treating compile success key presence or subscription status alone as proof }
