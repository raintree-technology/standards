version: 1
integration: stripe
workflows:
  - { id: STRIPE-WF-PAYMENT-RELEASE, name: Release a payment flow, trigger: Checkout or payment creation changes, sources: [STRIPE-SRC-PAYMENTS, STRIPE-SRC-WEBHOOKS, STRIPE-SRC-IDEMPOTENCY], capabilities: [STRIPE-CAP-CHECKOUT, STRIPE-CAP-WEBHOOK], steps: [Select the current supported surface, bind a business idempotency key, verify signed events and authoritative state, exercise success decline timeout duplicate and reorder], stop_conditions: [Final state depends on a redirect, duplicate financial effects are possible, live and test resources are mixed], outputs: [Versioned contract, replay evidence, reconciliation result] }
  - { id: STRIPE-WF-FINANCIAL-CORRECTION, name: Execute a refund or Connect correction, trigger: Money must be refunded transferred reversed or compensated, sources: [STRIPE-SRC-PAYMENTS, STRIPE-SRC-CONNECT, STRIPE-SRC-IDEMPOTENCY], capabilities: [STRIPE-CAP-REFUND, STRIPE-CAP-CONNECT-TRANSFER, STRIPE-CAP-WEBHOOK], steps: [Confirm exact objects amount responsibility and capability state, obtain exact approval, execute once, reconcile balances events and local ledger], stop_conditions: [Responsibility is unclear, capability state is inactive, exact target or amount is missing], outputs: [Approval record, provider objects, reconciled ledger and compensation state] }
  - { id: STRIPE-WF-TAX-CHANGE, name: Review a tax collection change, trigger: Automatic tax registration or product tax behavior changes, sources: [STRIPE-SRC-TAX, STRIPE-SRC-PAYMENTS], capabilities: [STRIPE-CAP-TAX-REGISTRATION, STRIPE-CAP-CHECKOUT], steps: [Obtain qualified jurisdiction and product decisions, inspect active registration state, stage the collection change, verify a representative calculation], stop_conditions: [No qualified tax owner, registration is not active, a tax code would be guessed], outputs: [Qualified decision, registration evidence, calculation evidence] }
  - { id: STRIPE-WF-LIFECYCLE-AUDIT, name: Audit Stripe platform lifecycle controls, trigger: API version credentials Billing state or entitlement behavior changes, sources: [STRIPE-SRC-VERSIONING, STRIPE-SRC-KEYS, STRIPE-SRC-BILLING, STRIPE-SRC-WEBHOOKS], capabilities: [STRIPE-CAP-API-UPGRADE, STRIPE-CAP-CREDENTIAL, STRIPE-CAP-BILLING], steps: [Inventory versions credentials consumers and billing objects, run old and new contract fixtures, exercise least-authority rotation, rebuild representative billing state from authoritative objects and events], stop_conditions: [A consumer or endpoint version is unknown, credential denial is untested, access depends on one non-final billing field], outputs: [Compatibility matrix, credential findings, reconciled billing and entitlement evidence] }
