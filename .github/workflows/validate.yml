name: Validate standards bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate OKF bundle and Raintree catalog
        run: ruby scripts/validate_catalog.rb

      - name: Parse JSON Schema
        run: ruby -rjson -e 'JSON.parse(File.read("schema/standard.schema.json"))'
