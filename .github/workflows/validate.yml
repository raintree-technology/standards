name: Validate standards bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate OKF bundle and Raintree catalog
        run: ruby scripts/validate_catalog.rb

      - name: Parse JSON Schema
        run: ruby -rjson -e 'JSON.parse(File.read("schema/standard.schema.json"))'
