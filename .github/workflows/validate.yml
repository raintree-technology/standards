name: Validate standards bundle

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checkout. No job raises it.
permissions:
  contents: read

# A superseded push or pull-request update cancels its predecessor rather than
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned rather than ubuntu-latest so a runner-image rollover cannot change
    # the toolchain underneath a green build.
    runs-on: ubuntu-24.04
    # Generous enough to cover a cold cache, where mise may fall back to
    # building Ruby from source instead of fetching a precompiled build.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The validators only read files; leaving the token on disk for later
          # steps serves no purpose here.
          persist-credentials: false

      # The runner image ships its own Ruby, which changes with the image and is
      # currently an end-of-life release. Installing the pinned version keeps CI
      # on the same supported interpreter contributors run locally.
      #
      # mise rather than ruby/setup-ruby because this repository restricts
      # workflows to an allowlist of actions, and mise is on it while
      # setup-ruby is not. Using it also means CI and a contributor's machine
      # run the same tool against the same .tool-versions file. The SHA is the
      # exact one the allowlist permits, which the repository's
      # sha_pinning_required policy also demands.
      - name: Set up Ruby
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Report Ruby version
        run: ruby -v

      - name: Validate OKF bundle and raintree.standards catalog
        run: ruby scripts/validate_catalog.rb

      - name: Validate integration capability bundles
        run: ruby scripts/validate_integrations.rb

      - name: Check JSON Schemas against the handwritten validators
        run: ruby scripts/test_schema_drift.rb

      - name: Test the shared validator library
        run: ruby scripts/test_standards_lib.rb

      - name: Test catalog validator behaviour
        run: ruby scripts/test_validate_catalog.rb

      - name: Test integration validator behaviour
        run: ruby scripts/test_validate_integrations.rb

      - name: Parse JSON Schemas and workflow definitions
        run: |
          ruby -rjson -e 'Dir["schema/*.json"].sort.each { |path| JSON.parse(File.read(path)) }'
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].sort.each { |path| YAML.safe_load(File.read(path), aliases: false) }'
