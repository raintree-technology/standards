name: Validator defect
description: Report a false pass, false failure, crash, or unclear validator result.
title: "Validator: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or sensitive security details.
  - type: dropdown
    id: validator
    attributes:
      label: Validator
      options:
        - Catalog
        - Integration
        - GitHub Actions workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the command, result, and smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and Ruby version when relevant.
